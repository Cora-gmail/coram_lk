<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>單字道場｜登入</title>
<style>
:root{--paper:#EEF2F6;--surface:#fff;--ink:#17202E;--muted:#5C6778;--ai:#24467A;--beni:#B93A26;--line:#CDD5E0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--paper:#0E1524;--surface:#172238;--ink:#E7ECF4;--muted:#9AA6BA;--ai:#8FB0E6;--beni:#F08A75;--line:#2C3A56}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  display:grid;place-items:center;padding:20px}
form{width:100%;max-width:360px;background:var(--surface);border-radius:24px;padding:32px 24px}
.hanko{width:64px;height:64px;border-radius:12px;background:#B93A26;color:#fff;display:grid;place-items:center;
  font-size:36px;font-weight:900;transform:rotate(-4deg);margin-bottom:16px;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
h1{margin:0 0 4px;font-size:24px}
p{margin:0 0 20px;color:var(--muted);font-size:15px}
input[type=password]{width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:13px 14px;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:15px;color:var(--muted)}
label input{width:18px;height:18px}
button{width:100%;border:0;border-radius:14px;background:var(--ai);color:var(--surface);font-size:17px;font-weight:700;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--beni);font-size:14px;min-height:1.5em;margin-top:10px}
</style>
</head>
<body>
<form id="f">
  <div class="hanko">覚</div>
  <h1>單字道場</h1>
  <p>輸入密碼開始練習</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="密碼" required>
  <label><input type="checkbox" id="rem" checked>在這台裝置記住我</label>
  <button id="go">進入</button>
  <div class="err" id="err"></div>
</form>

const KEY = "jv-lock-key";
const b2u = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const u2b = u => { let s=""; for (let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(D.i)}, key, b2u(D.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function fromPw(pw){
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b2u(D.s), iterations:D.n, hash:"SHA-256"}, mat, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
(async () => {
  if (!window.crypto || !crypto.subtle){ document.getElementById("err").textContent = "這個瀏覽器不支援解密，請改用 Chrome 或 Safari，並確認網址是 https 開頭。"; return; }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved){
    try { const k = await crypto.subtle.importKey("raw", b2u(saved), "AES-GCM", false, ["decrypt"]); await openWith(k); return; }
    catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} }
  }
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "解鎖中…"; err.textContent = "";
  try {
    const key = await fromPw(document.getElementById("pw").value);
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(D.i)}, key, b2u(D.c));
    if (document.getElementById("rem").checked){ try{ localStorage.setItem(KEY, u2b(raw)); }catch(_){} }
    await openWith(key);
  } catch(ex){
    err.textContent = "密碼不對，再試一次。";
    btn.disabled = false; btn.textContent = "進入";
    document.getElementById("pw").select();
  }
});
